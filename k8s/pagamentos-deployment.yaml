apiVersion: apps/v1
kind: Deployment

metadata:
  name: pagamentos-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: pagamentos

  template:
    metadata:
      labels:
        app: pagamentos

    spec:
      containers:
      - name: pagamentos
        image: fastdelivery-devops22-pagamentos

        ports:
        - containerPort: 3000