apiVersion: apps/v1
kind: Deployment

metadata:
  name: estoque-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: estoque

  template:
    metadata:
      labels:
        app: estoque

    spec:
      containers:
      - name: estoque
        image: fastdelivery-devops22-estoque

        ports:
        - containerPort: 3000