apiVersion: apps/v1
kind: Deployment

metadata:
  name: pedidos-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: pedidos

  template:
    metadata:
      labels:
        app: pedidos

    spec:
      containers:
        - name: pedidos
          image: pedidos-service:latest

          ports:
            - containerPort: 3000